<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Agenda Eletrônica</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/responsivo.css" />
  </head>
  <body>
    <button id="btnTema" class="btn-tema-flutuante">🌙</button>

    <div id="miniCalendario" class="mini-calendario">
      <div class="mes-ano">
        <button id="btnMesAnterior" class="btn-mes">&lt;</button>
        <span id="mesAnoTitulo">Outubro 2026</span>
        <button id="btnMesProximo" class="btn-mes">&gt;</button>
      </div>
      <div class="dias-semana">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span
        ><span>S</span><span>S</span>
      </div>
      <div class="grid-dias" id="gridDias"></div>
      <div class="busca-lateral-container">
        <input type="text" id="campoBusca" placeholder="Pesquisar tarefa" />
        <button id="btnBusca">Buscar</button>
      </div>
    </div>

    <div class="container">
      <header>
        <h1>Minha Agenda Eletrônica</h1>
        <div id="dataHora" class="data-hora"></div>
      </header>

      <div class="input-container">
        <input type="text" id="campoTarefa" placeholder="Digite uma tarefa" />
        <input type="date" id="campoDataTarefa" />

        <div class="linha-dupla">
          <select id="campoCategoria">
            <option value="" disabled selected hidden>Categoria</option>
            <option value="pessoal">Pessoal 🏠</option>
            <option value="trabalho">Trabalho 💻</option>
            <option value="estudos">Estudos 📘</option>
            <option value="urgente">Urgente 🔥</option>
          </select>

          <select id="campoPrioridade">
            <option value="" disabled selected hidden>Prioridade</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>
        <button id="btnAdicionar">Adicionar</button>
      </div>

      <div class="filtros-container">
        <button class="btn-filtro ativo" data-filtro="todas">Todas</button>
        <button class="btn-filtro" data-filtro="pendentes">Pendentes</button>
        <button class="btn-filtro" data-filtro="concluidas">Concluídas</button>
      </div>

      <ul id="listaTarefas">
        <li>Exemplo de tarefa (pode apagar depois)</li>
      </ul>

      <div id="contadorTarefas" class="contador">
        Nenhuma Tarefa Pendente 📱
      </div>
    </div>

    <div id="painelProgresso" class="painel-progresso-flutuante">
      <div class="info-progresso">
        <span id="textoProgresso">0% concluído</span>
        <span id="contadorConcluidas">0 de 0</span>
      </div>
      <div class="barra-fundo">
        <div id="barraPreenchida" class="barra-preenchida"></div>
      </div>
    </div>

    <!-- BIBLIOTECA DE CONFETES (Via CDN Atualizada) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <script src="js/index.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js");
        });
      }
    </script>
  </body>
</html>
